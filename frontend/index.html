<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fall Detector</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #141420;
      --border: #2a2a3a;
      --text: #e0e0e8;
      --text-dim: #888894;
      --accent: #4a9eff;
      --danger: #ff4a4a;
      --success: #4aff7a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      margin-bottom: 16px;
    }

    h1 { font-size: 1.4rem; font-weight: 600; }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .status-dot.ok { background: var(--success); }
    .status-dot.alert { background: var(--danger); animation: pulse 0.5s infinite alternate; }
    .status-dot.warn { background: #ffaa00; animation: pulse 1s infinite alternate; }

    @keyframes pulse {
      from { opacity: 1; }
      to { opacity: 0.3; }
    }

    .camera-container {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 4 / 3;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .camera-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-dim);
    }

    .alert-banner {
      display: none;
      width: 100%;
      max-width: 720px;
      margin-top: 16px;
      padding: 16px 20px;
      border-radius: 12px;
      font-weight: 600;
      text-align: center;
      font-size: 1.1rem;
    }

    .alert-banner.warning {
      display: block;
      background: rgba(255, 165, 0, 0.15);
      border: 1px solid rgba(255, 165, 0, 0.4);
      color: #ffaa00;
    }

    .alert-banner.emergency {
      display: block;
      background: rgba(255, 74, 74, 0.15);
      border: 1px solid rgba(255, 74, 74, 0.4);
      color: var(--danger);
    }

    .controls {
      width: 100%;
      max-width: 720px;
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: var(--border); }
    button.danger { border-color: rgba(255, 74, 74, 0.4); color: var(--danger); }
    button.danger:hover { background: rgba(255, 74, 74, 0.15); }

    .log {
      width: 100%;
      max-width: 720px;
      margin-top: 16px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .log-entry { padding: 2px 0; }
    .log-entry.alert { color: var(--danger); }
    .log-entry.warn { color: #ffaa00; }
    .log-entry.ok { color: var(--success); }
  </style>
</head>
<body>
  <header>
    <h1>Fall Detector</h1>
    <div class="status">
      <span id="statusText">Connecting...</span>
      <div class="status-dot" id="statusDot"></div>
    </div>
  </header>

  <div class="camera-container">
    <img id="videoFeed" src="http://localhost:5000/video" alt="Camera feed">
    <div class="camera-placeholder" id="placeholder" style="display:none;">
      <span>Waiting for camera feed from server...</span>
    </div>
  </div>

  <div class="alert-banner" id="alertBanner"></div>

  <div class="controls">
    <button onclick="simulateEmergency()" class="danger">Simulate Emergency</button>
    <button onclick="resetStatus()">Reset</button>
  </div>

  <div class="log" id="log"></div>

  <script>
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const alertBanner = document.getElementById('alertBanner');
    const logEl = document.getElementById('log');
    const videoFeed = document.getElementById('videoFeed');
    const placeholder = document.getElementById('placeholder');

    let lastState = '';

    function log(msg, type = '') {
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + type;
      entry.textContent = `[${time}] ${msg}`;
      logEl.prepend(entry);
    }

    videoFeed.onerror = () => {
      videoFeed.style.display = 'none';
      placeholder.style.display = 'flex';
    };

    videoFeed.onload = () => {
      videoFeed.style.display = 'block';
      placeholder.style.display = 'none';
    };

    async function pollStatus() {
      try {
        const res = await fetch('http://localhost:5000/status');
        const data = await res.json();

        let newState = '';
        if (data.emergency) {
          newState = 'emergency';
          alertBanner.className = 'alert-banner emergency';
          alertBanner.style.display = 'block';
          alertBanner.textContent = 'EMERGENCY — Robot seeking nearest person (' + (data.direction || 'scanning') + ')';
          statusText.textContent = 'EMERGENCY';
          statusDot.className = 'status-dot alert';
        } else if (data.fall_waiting) {
          newState = 'waiting';
          alertBanner.className = 'alert-banner warning';
          alertBanner.style.display = 'block';
          alertBanner.textContent = 'Fall Detected — Waiting for response...';
          statusText.textContent = 'Fall detected';
          statusDot.className = 'status-dot warn';
        } else {
          newState = 'ok';
          alertBanner.style.display = 'none';
          statusText.textContent = data.ble_connected ? 'Monitoring' : 'No BLE';
          statusDot.className = 'status-dot' + (data.ble_connected ? ' ok' : '');
        }

        if (newState !== lastState) {
          if (newState === 'emergency') log('EMERGENCY — no response, robot deployed!', 'alert');
          else if (newState === 'waiting') log('Fall detected — waiting for user response', 'warn');
          else if (lastState === 'emergency') log('Emergency cleared', 'ok');
          else if (lastState === 'waiting') log('Fall cancelled', 'ok');
          lastState = newState;
        }
      } catch (e) {
        statusText.textContent = 'Server offline';
        statusDot.className = 'status-dot';
      }
    }

    async function simulateEmergency() {
      await fetch('http://localhost:5000/simulate/emergency');
      log('Simulated emergency triggered', 'alert');
    }

    async function resetStatus() {
      await fetch('http://localhost:5000/simulate/reset');
      log('Reset to monitoring', 'ok');
    }

    setInterval(pollStatus, 500);
    pollStatus();
    log('Dashboard loaded — connecting to server...');
  </script>
</body>
</html>
